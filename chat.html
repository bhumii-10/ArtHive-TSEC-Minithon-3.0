<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arthive Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .chat-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 85vh;
            max-height: 700px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            border-radius: 12px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            z-index: 1001;
            animation: chatAppear 0.8s ease-out;
            display: flex;
            flex-direction: column;
        }

        @keyframes chatAppear {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .chat-header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            padding: 10px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            gap: 12px;
            height: 60px;
            flex-shrink: 0;
        }

        .chat-header .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .chat-header .user-info {
            flex-grow: 1;
        }

        .chat-header h3 {
            color: white;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .chat-header .status {
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
        }

        .chat-header .actions {
            display: flex;
            gap: 16px;
        }

        .header-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 20px;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .header-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .chat-messages {
            height: 450px;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }

        .message {
            max-width: 75%;
            padding: 8px 12px;
            border-radius: 7.5px;
            word-wrap: break-word;
            animation: messageSlide 0.3s ease-out;
            position: relative;
            margin: 2px 0;
        }

        @keyframes messageSlide {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            background: #764ba2;
            color: white;
            align-self: flex-end;
            margin-left: auto;
            border-radius: 7.5px 0 7.5px 7.5px;
        }

        .message.user::after {
            content: '';
            position: absolute;
            right: -8px;
            top: 0;
            width: 0;
            height: 0;
            border: 8px solid transparent;
            border-left-color: #764ba2;
            border-right: 0;
            border-top: 0;
        }

        .message.bot {
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            align-self: flex-start;
            border-radius: 0 7.5px 7.5px 7.5px;
        }

        .message.bot::after {
            content: '';
            position: absolute;
            left: -8px;
            top: 0;
            width: 0;
            height: 0;
            border: 8px solid transparent;
            border-right-color: rgba(255, 255, 255, 0.95);
            border-left: 0;
            border-top: 0;
        }

        .message .meta {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            margin-top: 2px;
            font-size: 11px;
            opacity: 0.7;
        }

        .message .time {
            margin-right: 4px;
        }

        .message .status {
            font-size: 14px;
        }

        .chat-input-container {
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .chat-input-wrapper {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.95);
            outline: none;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .chat-input:focus {
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.3);
        }

        .action-btn {
            background: none;
            border: none;
            color: white;
            padding: 8px;
            cursor: pointer;
            font-size: 20px;
            opacity: 0.8;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            opacity: 1;
        }

        .send-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: #764ba2;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-size: 18px;
        }

        .send-btn:hover {
            transform: scale(1.05);
            background: #855bb5;
        }

        .typing-indicator {
            display: none;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            align-self: flex-start;
            max-width: 80px;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #666;
            border-radius: 50%;
            animation: typingBounce 1.5s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.3s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.6s;
        }

        @keyframes typingBounce {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }

        .floating-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 15s infinite linear;
        }

        .shape:nth-child(1) {
            width: 80px;
            height: 80px;
            left: 10%;
            animation-delay: 0s;
        }

        .shape:nth-child(2) {
            width: 60px;
            height: 60px;
            left: 20%;
            animation-delay: 2s;
        }

        .shape:nth-child(3) {
            width: 100px;
            height: 100px;
            left: 80%;
            animation-delay: 4s;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        @media (max-width: 480px) {
            .chat-container {
                width: 90%;
                height: 80%;
            }
        }
    </style>
</head>
<body>
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="chat-header">
            <div class="avatar">🎨</div>
            <div class="user-info">
                <h3>Arthive Assistant</h3>
                <div class="status">online</div>
            </div>
            <div class="actions">
                <button class="header-btn">
                    <i class="fas fa-search"></i>
                </button>
                <button class="header-btn">
                    <i class="fas fa-ellipsis-v"></i>
                </button>
            </div>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                <div class="content">
                    Hello! Welcome to Arthive! 🎨 I'm here to help you explore our digital art platform. How can I assist you today?
                </div>
                <div class="meta">
                    <span class="time">12:00</span>
                </div>
            </div>
        </div>

        <div class="typing-indicator" id="typingIndicator">
            <div class="typing-dots">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        </div>

        <div class="chat-input-container">
            <div class="chat-input-wrapper">
                <button class="action-btn">
                    <i class="far fa-laugh"></i>
                </button>
                <button class="action-btn">
                    <i class="fas fa-paperclip"></i>
                </button>
                <input 
                    type="text" 
                    class="chat-input" 
                    id="chatInput" 
                    placeholder="Type a message"
                    onkeypress="handleKeyPress(event)"
                >
                <button class="send-btn" onclick="sendMessage()">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        function minimizeChat() {
            const container = document.getElementById('chatContainer');
            container.style.transform = 'translate(-50%, -50%) scale(0)';
            container.style.opacity = '0';
            
            setTimeout(() => {
                container.style.transform = 'translate(-50%, -50%) scale(1)';
                container.style.opacity = '1';
            }, 2000); // Reappear after 2 seconds
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            // Add user message
            addMessage(message, 'user');
            input.value = '';
            
            // Show typing indicator
            showTypingIndicator();
            
            // Simulate bot response
            setTimeout(() => {
                hideTypingIndicator();
                const responses = [
                    "That's a great question! 🎨 Arthive offers amazing tools for digital artists to showcase their work.",
                    "I'd be happy to help you with that! ✨ Our platform supports various digital art formats.",
                    "Excellent! 🚀 Let me guide you through our creative features and portfolio tools.",
                    "Thanks for asking! 💫 Arthive is designed to connect artists with art lovers worldwide.",
                    "That's wonderful! 🌟 Our community is full of talented digital artists and creative minds."
                ];
                const randomResponse = responses[Math.floor(Math.random() * responses.length)];
                addMessage(randomResponse, 'bot');
            }, 1500);
        }

        function addMessage(text, type) {
            const messagesContainer = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const content = document.createElement('div');
            content.className = 'content';
            content.textContent = text;
            
            const meta = document.createElement('div');
            meta.className = 'meta';
            
            const time = document.createElement('span');
            time.className = 'time';
            time.textContent = new Date().toLocaleTimeString('en-US', { 
                hour: 'numeric', 
                minute: 'numeric',
                hour12: true 
            });
            
            meta.appendChild(time);
            
            if (type === 'user') {
                const status = document.createElement('span');
                status.className = 'status';
                status.innerHTML = '<i class="fas fa-check-double"></i>';
                meta.appendChild(status);
            }
            
            messageDiv.appendChild(content);
            messageDiv.appendChild(meta);
            
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function showTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            const messagesContainer = document.getElementById('chatMessages');
            
            indicator.style.display = 'block';
            messagesContainer.appendChild(indicator);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function hideTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            indicator.style.display = 'none';
        }

        // Auto-focus input on load
        window.addEventListener('load', () => {
            document.getElementById('chatInput').focus();
            
            // Create floating animation for better visual appeal
            setInterval(() => {
                const shapes = document.querySelectorAll('.shape');
                shapes.forEach(shape => {
                    const randomDelay = Math.random() * 2000;
                    setTimeout(() => {
                        shape.style.animationDuration = (10 + Math.random() * 10) + 's';
                    }, randomDelay);
                });
            }, 15000);
        });
    </script>
</body>
</html>
